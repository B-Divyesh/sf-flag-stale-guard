name: Flag Stale Guard
description: Block CI when configured release flags are expired, missing metadata, or still referenced during removal review.
inputs:
  config:
    description: Path to the Flag Stale Guard TOML file in the checked-out repository.
    required: false
    default: flag-stale-guard.toml
runs:
  using: composite
  steps:
    - name: Scan configured flags
      shell: bash
      run: cargo run --quiet --manifest-path "${{ github.action_path }}/Cargo.toml" -- scan --config "${{ inputs.config }}" --check
