[package]
name = "flag-stale-guard"
version = "0.1.0"
edition = "2021"
description = "A local removal gate for stale release flags"
license = "MIT"

[[bin]]
name = "flag-stale-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
